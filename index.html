<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<link rel="icon" href="favicon.ico" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
<style>
:root{--paper:#fbf6ea;--grid:#eadfc6;--ink:#2b2a33;--muted:#7a7468;--card:#fffdf6;--pink:#f9cfd2;--blue:#cfe3f3;--butter:#fbe9a8;--sage:#d6e8d0;--pop:#ff8a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#23212a;--grid:#302d3a;--ink:#f1ead9;--muted:#a59f92;--card:#2d2a35;--pink:#6a4650;--blue:#3f5568;--butter:#6b5f34;--sage:#46604a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#23212a;--grid:#302d3a;--ink:#f1ead9;--muted:#a59f92;--card:#2d2a35;--pink:#6a4650;--blue:#3f5568;--butter:#6b5f34;--sage:#46604a;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:18px/1.25 "Patrick Hand","Comic Sans MS",cursive,sans-serif;color:var(--ink);background:var(--paper)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--paper)}
h1{font:700 34px "Caveat","Comic Sans MS",cursive;margin:0 auto 0 0;transform:rotate(-1.5deg)}
h1 u{text-decoration-color:var(--pop);text-decoration-thickness:3px;text-underline-offset:4px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--butter);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button.pop{background:var(--pop);color:#2b2a33}
#stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background-color:var(--paper)}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
.zm{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
.zm select{background:var(--paper);border:2px solid var(--ink);border-radius:8px;height:30px;padding:0 4px}
header{position:relative}#set summary{list-style:none;cursor:pointer;background:var(--butter);color:var(--ink);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink)}#set summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:8px;top:100%;z-index:6;max-width:calc(100vw - 16px);box-sizing:border-box;display:flex;flex-direction:column;gap:8px;min-width:200px;padding:10px;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}.menu label{display:flex;flex-wrap:wrap;gap:6px;align-items:center}#pn .dp{margin:0 0 4px}#pn .dp input:first-child{flex:1.5}
.lk{position:absolute;right:5px;bottom:2px;font-size:15px;line-height:1;cursor:crosshair;opacity:.55}.lk:hover{opacity:1}
#rb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
#lm{position:fixed;z-index:9;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink)}#lm[hidden]{display:none}
.tb{position:absolute;cursor:pointer;white-space:nowrap}.tb i{display:block;box-sizing:border-box;height:12px;border:2px solid var(--ink);border-radius:6px;background:var(--card)}.tb.sel{outline:3px dashed var(--pop);outline-offset:3px}
.tk{position:absolute;top:0;height:100%;border-left:1px dashed color-mix(in srgb,var(--ink) 22%,transparent);font-size:13px;color:var(--muted);padding:2px 0 0 3px}.und{position:absolute;color:var(--muted)}
.ax{position:absolute;height:0;border-top:3px solid var(--ink)}.at{position:absolute;height:10px;border-left:2px solid var(--ink);margin-top:-5px}.ak{position:absolute;font-size:13px;color:var(--muted)}
.es{position:absolute;width:0;border-left:2px solid var(--ink)}.ed{position:absolute;z-index:2;width:12px;height:12px;box-sizing:border-box;border:2px solid var(--ink);border-radius:50%;background:var(--card)}
.ev{position:absolute;z-index:1;box-sizing:border-box;height:28px;line-height:24px;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px;box-shadow:2px 2px 0 var(--ink)}
.k-birth{background:var(--sage)}.k-death{background:var(--blue)}.k-marriage{background:var(--pink)}.k-other{background:var(--butter)}.ev.sel{outline:3px dashed var(--pop);outline-offset:2px}
header select,header input[type=color]{background:var(--paper);border:2px solid var(--ink);border-radius:8px;height:30px;padding:0 4px}
#q{width:140px;height:30px;box-sizing:border-box;padding:0 8px;background:var(--paper);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px}
#sr{position:absolute;top:110%;left:0;z-index:5;min-width:300px;background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
#sr:empty{display:none}#sr div{padding:4px 10px;cursor:pointer}#sr div:hover{background:var(--butter);color:#2b2a33}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sw .s{width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;cursor:pointer}
.sw .s.on{outline:3px dashed var(--pop);outline-offset:2px}#pn .sw input{width:34px;display:inline-block;padding:0;margin:0}
#pn select.ms{display:inline-block;width:auto;margin:0 6px 6px 0}
#cv svg{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;width:156px;height:82px;box-sizing:border-box;padding:8px 10px;overflow:hidden;cursor:pointer;background:var(--card);border:2px solid var(--ink);
border-radius:12px 18px 14px 20px/18px 12px 20px 14px;box-shadow:3px 3px 0 var(--ink);transform:rotate(calc(var(--r)*1deg))}

.n.sel{outline:3px dashed var(--pop);outline-offset:3px}
.n b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n i,.n small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hint{position:absolute;left:50%;top:50%;width:max-content;max-width:90%;transform:translate(-50%,-50%) rotate(-2deg);pointer-events:none;font:700 30px "Caveat",cursive;text-align:center;color:var(--muted)}
#pn{position:fixed;right:0;top:0;bottom:0;width:min(370px,100%);box-sizing:border-box;overflow:auto;padding:0;
background:var(--card);border-left:2px solid var(--ink);box-shadow:-4px 0 0 var(--grid)}
#pn[hidden]{display:none}
#pn label{display:block;margin:8px 0;font-size:15px;color:var(--muted)}
#pn input,#pn textarea,#pn select,dialog textarea{display:block;width:100%;box-sizing:border-box;margin-top:2px;padding:4px 8px;background:var(--paper);border:2px solid var(--ink);border-radius:8px 12px 9px 13px/12px 8px 13px 9px}
#pn textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}.row label{flex:1}
h4{font:700 24px "Caveat",cursive;margin:12px 0 4px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:1px 4px 1px 10px;background:var(--sage);border:2px solid var(--ink);border-radius:14px;cursor:pointer}
.chip b{padding:0 6px;color:var(--pop)}
.ph{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;border-bottom:2px dashed var(--ink)}.ph h4{margin:0}.pb{padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.gp{display:flex;flex-wrap:wrap;margin-bottom:4px}.gp .chip{padding:1px 10px}.chip.on{background:var(--butter);color:#2b2a33}
.n.pic{padding-right:50px}.n img{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);object-fit:cover}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog{width:min(560px,92vw);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px 20px 16px 22px/20px 14px 22px 16px;box-shadow:5px 5px 0 var(--ink)}
dialog textarea{height:240px;font:14px/1.3 ui-monospace,monospace}
</style>
</head>
<body>
<header>
<h1>Family <u>Tree</u></h1>
<button class="pop" data-a="add">＋ Person</button>
<div style="position:relative"><input id="q" placeholder="Search…" autocomplete="off"><div id="sr"></div></div>
<button data-a="undo" title="Undo">↶</button><button data-a="redo" title="Redo">↷</button><select id="vw" title="View"><option value="">Tree</option><option value="t">Life spans</option><option value="e">Events</option></select>
<details id="set"><summary title="Settings">⚙</summary><div class="menu"><button data-a="expall">Export all</button><button data-a="imp">Import / sync</button><label>Paper <select id="pat"><option value="dots">dots</option><option value="grid">grid</option><option value="lines">lines</option><option value="none">plain</option></select></label><label>Colours <input type="color" id="bgc" title="Paper colour"><input type="color" id="pc" title="Dot/line colour"><button data-a="bgr" title="Reset colours">↺</button></label></div></details>
</header>
<div id="stage"><div id="cv"></div><div class="hint" id="em" hidden>A blank page ✎<br>add your first person</div><svg id="rb" style="display:none"><line stroke="var(--pop)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/></svg><div class="zm"><button data-a="zi">＋</button><button data-a="zo">－</button><button data-a="fit">Fit</button><select id="fm" title="Focus on the selected person"><option value="">Focus: off</option><option value="up">ancestors</option><option value="down">descendants</option><option value="hg">both</option><option value="all">family</option></select></div></div>
<aside id="pn" hidden></aside><div id="lm" hidden></div>
<dialog id="io"><h4 id="iot"></h4><textarea id="ta" spellcheck="false"></textarea>
<div class="bar"><button data-a="copy">Copy</button><button data-a="ged">JSON → GEDCOM 7</button><button class="pop" data-a="merge">Import this</button><input type="file" id="fi" accept=".json,application/json"><button data-a="ioclose">Close</button></div>
<p id="msg"></p></dialog>
<script>
const K="famtree.v1",CW=200,RH=140,CH=82;
let S={people:{}},sel=null,V={x:20,y:20,k:1},FS=null,FM="",VM="",DIM={w:1,h:1},POS={},sg=null,LK=null,H=[],R=[],last="",lt=0;
const PAL={"#f9cfd2":"#c76b78","#fbe0c4":"#c9824a","#fbe9a8":"#b8962e","#d6e8d0":"#6f9a62","#c9ece3":"#4f9d8c","#cfe3f3":"#5b8fbf","#ddd3f0":"#8a72b8"},
  bdr=c=>PAL[c]||"#"+[1,3,5].map(i=>Math.round(parseInt(c.slice(i,i+2),16)*.55).toString(16).padStart(2,"0")).join("");const PT=["biological","adopted","step","foster"],GN=["female","male","nonbinary","genderqueer","genderfluid","agender","trans woman","trans man","intersex","two-spirit","other","unknown"];const MS=["married","partner","engaged","separated","divorced","widowed"];
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const P=()=>S.people,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const nm=i=>{const x=P()[i];return x?[x.first,x.middle,x.last].filter(Boolean).join(" ")||"Unnamed":"?"};
const yr=x=>(String(x.born||"").match(/\d{4}/)||[""])[0];
const lab=i=>{const x=P()[i];return nm(i)+(yr(x)?` (b. ${yr(x)})`:"")+(x.parents.length?` · child of ${x.parents.map(q=>nm(q)).join(" & ")}`:"")};
const blank=id=>({id,first:"",middle:"",last:"",other:"",gender:"",color:"",born:"",died:"",dates:"",bio:"",parents:[],spouses:[],ms:{},pt:{},photo:"",bplace:"",dplace:"",src:"",dec:false,btime:"",dtime:"",u:0});
const kids=id=>Object.keys(P()).filter(i=>P()[i].parents.includes(id));
const sibs=id=>Object.keys(P()).filter(i=>i!==id&&P()[i].parents.some(q=>P()[id].parents.includes(q)));

function clean(){ // keep relations valid and spouses symmetric
  const p=P(),ok=i=>p[i];
  for(const i in p){const x=p[i];if(x.name!==undefined){const w=String(x.name).trim().split(/\s+/).filter(Boolean);if(!x.first&&!x.last){x.first=w[0]||"";x.last=w.length>1?w[w.length-1]:"";x.middle=w.slice(1,-1).join(" ")}delete x.name}x.first??="";x.middle??="";x.last??="";x.color??="";x.ms={...x.ms};x.pt={...x.pt};x.born=nd(x.born);x.died=nd(x.died);x.parents=[...new Set(x.parents||[])].filter(a=>ok(a)&&a!==i);x.spouses=[...new Set(x.spouses||[])].filter(a=>ok(a)&&a!==i)}
  for(const i in p)p[i].spouses.forEach(s=>{if(!p[s].spouses.includes(i))p[s].spouses.push(i);p[i].ms[s]=p[s].ms[i]=p[i].ms[s]||p[s].ms[i]||"married"});
}
function link(k,a,b){const p=P();
  if(k==="parents")p[a].parents.push(b);
  else if(k==="children")p[b].parents.push(a);
  else if(k==="siblings"){const pa=p[a].parents,pb=p[b].parents;
    if(pa.length)p[b].parents=[...new Set([...pb,...pa])];else if(pb.length)p[a].parents=[...pb];
    else{const id=uid();p[id]={...blank(id),first:"(unknown parent)"};p[a].parents=[id];p[b].parents=[id]}}
  else{p[a].spouses.push(b);p[b].spouses.push(a)}clean()}
function unlink(k,a,b){const p=P(),d=(arr,v)=>arr.splice(0,arr.length,...arr.filter(x=>x!==v));
  if(k==="parents")d(p[a].parents,b);else if(k==="children")d(p[b].parents,a);else if(k==="siblings")p[b].parents=p[b].parents.filter(q=>!p[a].parents.includes(q));else{d(p[a].spouses,b);d(p[b].spouses,a)}}

function edges(p,pos){
  const ids=Object.keys(p),fam={},o=[],lanes={},adj=(a,b)=>pos[a].y===pos[b].y&&Math.abs(pos[a].x-pos[b].x)===CW,
    mk={married:"♥",partner:"♡",engaged:"◇",separated:"sep.",divorced:"div.",widowed:"wid."};
  // couples: a short line between adjacent cards (status symbol above it); otherwise a bracket underneath
  ids.forEach(i=>p[i].spouses.forEach(s=>{if(s<=i)return;const a=pos[i],b=pos[s],t=p[i].ms[s]||"married";
    if(adj(i,s)){const l=Math.min(a.x,b.x)+156,y=a.y+41;o.push(`<path class="sp ${t}" d="M${l} ${y}h${CW-156}"/><text class="st" x="${l+(CW-156)/2}" y="${y-6}" text-anchor="middle">${mk[t]||t}</text>`)}
    else o.push(`<path class="sp ${t}" d="M${a.x+78} ${a.y+CH}v12H${b.x+78}V${b.y+CH}"/>`)}));
  // children: one family = one trunk + one bus + one drop per child
  ids.forEach(i=>{const ps=[...p[i].parents].sort();if(ps.length)(fam[ps.join("|")]??={ps,ch:[]}).ch.push(i)});
  Object.values(fam).sort((a,b)=>pos[a.ch[0]].x-pos[b.ch[0]].x).forEach(f=>{
    const cy=pos[f.ch[0]].y,src=[];let ps=f.ps;
    if(ps.length>1&&p[ps[0]].spouses.includes(ps[1])&&adj(ps[0],ps[1])){const a=pos[ps[0]],b=pos[ps[1]];src.push([Math.min(a.x,b.x)+156+(CW-156)/2,a.y+41]);ps=ps.slice(2)}
    ps.forEach(q=>src.push([pos[q].x+78,pos[q].y+CH]));
    const xs=[...src.map(s=>s[0]),...f.ch.map(c=>pos[c].x+78)],lo=Math.min(...xs),hi=Math.max(...xs),L=lanes[cy]??=[];
    // bus height: lowest lane not already used by an overlapping bus in the same row
    let k=0;while(L.some(b=>b.k===k&&b.lo<hi+8&&b.hi>lo-8))k++;L.push({k,lo,hi});
    const by=cy-40+Math.min(k,4)*7;
    o.push(`<path d="${src.map(s=>`M${s[0]} ${s[1]}V${by}`).join("")}M${lo} ${by}H${hi}"/>`);
    f.ch.forEach(c=>o.push(`<path class="pt-${p[c].pt[f.ps[0]]||"biological"}" d="M${pos[c].x+78} ${by}V${pos[c].y}"/>`))});
  return o.join("")}
function layout(){
  const p=VP(),ids=Object.keys(p),g={},K={},X={},GAP=40,
    bk=i=>{const m=String(p[i].born||"").match(/(\d{4})(?:-(\d\d))?(?:-(\d\d))?/);return m?m[1]*372+(m[2]||0)*31+(+m[3]||0):1e12};
  ids.forEach(i=>{g[i]=0;K[i]=[]});ids.forEach(c=>p[c].parents.forEach(a=>K[a].push(c)));
  // 1. generations: parents above children, spouses level, parentless people pulled down next to their earliest child
  for(let n=0;n<ids.length*3+3;n++){let ch=false;
    ids.forEach(i=>{let v=g[i];p[i].parents.forEach(q=>v=Math.max(v,g[q]+1));p[i].spouses.forEach(q=>v=Math.max(v,g[q]));
      if(!p[i].parents.length&&!p[i].spouses.length&&K[i].length)v=Math.max(v,Math.min(...K[i].map(c=>g[c]))-1);
      if(v!==g[i]){g[i]=v;ch=true}});
    if(!ch)break}
  const gs=[...new Set(ids.map(i=>g[i]))].sort((a,b)=>a-b);ids.forEach(i=>g[i]=gs.indexOf(g[i]));
  const rows=gs.map(()=>[]);ids.forEach(i=>rows[g[i]].push(i));
  // 2. units = a person plus attached spouses (a person with 2+ spouses sits in the middle: s1 A s2)
  const U=rows.map(r=>{r.sort((a,b)=>bk(a)-bk(b)||(a<b?-1:1));const seen=new Set(),out=[];
    r.forEach(i=>{if(seen.has(i))return;seen.add(i);const m=[i];
      for(let k=0;k<m.length;k++)p[m[k]].spouses.forEach(s=>{if(g[s]===g[i]&&!seen.has(s)){seen.add(s);m.push(s)}});
      const h=m.length>2&&m.find(a=>m.every(b=>b===a||p[a].spouses.includes(b)));
      if(h){const o=m.filter(a=>a!==h),k=o.length>>1;m.splice(0,m.length,...o.slice(0,k),h,...o.slice(k))}
      out.push({m,h:!!h,f:m.map(a=>[...p[a].parents].sort().join()).find(Boolean)||""})});
    return out});
  const sp=(a,b)=>a.m.length*CW+(a.f&&a.f===b.f?0:GAP),               // start-to-start distance; siblings sit closer than other families
    vw=u=>(u.m.length-1)*CW+156,put=u=>u.m.forEach((i,k)=>X[i]=Math.round(u.x)+k*CW),
    pc=i=>{const q=p[i].parents.filter(a=>X[a]!=null);return q.length?q.reduce((s,a)=>s+X[a]+78,0)/q.length:null},T=a=>a[a.length-1];
  // place a row: every unit wants x=u.d (weight u.t); overlapping units are merged into blocks and centred on their average wish
  const solve=r=>{const B=[];
    r.forEach(u=>{let b={u:[u],o:[0],w:u.t,s:u.t*u.d,x:u.d};
      for(let a;(a=T(B))&&a.x+T(a.o)+sp(T(a.u),b.u[0])>b.x;){
        const D=T(a.o)+sp(T(a.u),b.u[0]);B.pop();
        b={u:[...a.u,...b.u],o:[...a.o,...b.o.map(v=>v+D)],w:a.w+b.w,s:a.s+b.s-D*b.w};b.x=b.s/b.w}
      B.push(b)});
    B.forEach(b=>b.u.forEach((u,k)=>{u.x=b.x+b.o[k];put(u)}))},
  run=(r,key)=>{r.forEach(u=>{const c=key(u);u.t=c==null?.01:1;u.k=c==null?u.x+vw(u)/2:c;u.d=u.k-vw(u)/2});r.sort((a,b)=>a.k-b.k);solve(r)},
  mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  U.forEach(r=>{let x=24;r.forEach((u,k)=>{u.x=x;put(u);if(r[k+1])x+=sp(u,r[k+1])})});
  // 3. alternate: children under their parents (top-down), parents over their children (bottom-up)
  for(let n=0;n<4;n++){
    for(let gi=1;gi<U.length;gi++){U[gi].forEach(u=>{if(!u.h&&u.m.length===2)u.m.sort((a,b)=>(pc(a)??1e9)-(pc(b)??1e9))});
      run(U[gi],u=>mean(u.m.map(pc).filter(k=>k!=null)))}
    for(let gi=U.length-2;gi>=0;gi--)
      run(U[gi],u=>{const c=[...new Set(u.m.flatMap(i=>K[i]))].map(i=>X[i]+78);return c.length?(Math.min(...c)+Math.max(...c))/2:null})}
  const dx=24-Math.min(...ids.map(i=>X[i])),pos={};ids.forEach(i=>pos[i]={x:X[i]+dx,y:g[i]*RH+30});
  return {pos,w:Math.max(...ids.map(i=>pos[i].x))+156+24,h:U.length*RH+40};
}

function render(){
  bg();snap();$("#em").hidden=!!Object.keys(P()).length;
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}

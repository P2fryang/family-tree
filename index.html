<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
<style>
:root{--paper:#fbf6ea;--grid:#eadfc6;--ink:#2b2a33;--muted:#7a7468;--card:#fffdf6;--pink:#f9cfd2;--blue:#cfe3f3;--butter:#fbe9a8;--sage:#d6e8d0;--pop:#ff8a6b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#23212a;--grid:#302d3a;--ink:#f1ead9;--muted:#a59f92;--card:#2d2a35;--pink:#6a4650;--blue:#3f5568;--butter:#6b5f34;--sage:#46604a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#23212a;--grid:#302d3a;--ink:#f1ead9;--muted:#a59f92;--card:#2d2a35;--pink:#6a4650;--blue:#3f5568;--butter:#6b5f34;--sage:#46604a;color-scheme:dark}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:18px/1.25 "Patrick Hand","Comic Sans MS",cursive,sans-serif;color:var(--ink);background:var(--paper)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:2px solid var(--ink);background:var(--paper)}
h1{font:700 34px "Caveat","Comic Sans MS",cursive;margin:0 auto 0 0;transform:rotate(-1.5deg)}
h1 u{text-decoration-color:var(--pop);text-decoration-thickness:3px;text-underline-offset:4px}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--butter);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px;padding:3px 12px;box-shadow:2px 2px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:none}
button.pop{background:var(--pop);color:#2b2a33}
#stage{flex:1;overflow:hidden;position:relative;touch-action:none;cursor:grab;background-color:var(--paper)}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
.zm{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
header select,header input[type=color]{background:var(--paper);border:2px solid var(--ink);border-radius:8px;height:30px;padding:0 4px}
#q{width:140px;height:30px;box-sizing:border-box;padding:0 8px;background:var(--paper);border:2px solid var(--ink);border-radius:10px 14px 11px 15px/14px 10px 15px 11px}
#sr{position:absolute;top:110%;left:0;z-index:5;min-width:300px;background:var(--card);border:2px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink)}
#sr:empty{display:none}#sr div{padding:4px 10px;cursor:pointer}#sr div:hover{background:var(--butter);color:#2b2a33}
.sw{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.sw .s{width:24px;height:24px;border:2px solid var(--ink);border-radius:50%;cursor:pointer}
.sw .s.on{outline:3px dashed var(--pop);outline-offset:2px}#pn .sw input{width:34px;display:inline-block;padding:0;margin:0}
#pn select.ms{display:inline-block;width:auto;margin:0 6px 6px 0}
#cv svg{position:absolute;inset:0;pointer-events:none}
.n{position:absolute;width:156px;height:82px;box-sizing:border-box;padding:8px 10px;overflow:hidden;cursor:pointer;background:var(--card);border:2px solid var(--ink);
border-radius:12px 18px 14px 20px/18px 12px 20px 14px;box-shadow:3px 3px 0 var(--ink);transform:rotate(calc(var(--r)*1deg))}

.n.sel{outline:3px dashed var(--pop);outline-offset:3px}
.n b{display:block;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n i,.n small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.hint{position:absolute;left:50%;top:80px;transform:translateX(-50%) rotate(-2deg);font:700 30px "Caveat",cursive;text-align:center;color:var(--muted)}
#pn{position:fixed;right:0;top:0;bottom:0;width:min(370px,100%);box-sizing:border-box;overflow:auto;padding:0;
background:var(--card);border-left:2px solid var(--ink);box-shadow:-4px 0 0 var(--grid)}
#pn[hidden]{display:none}
#pn label{display:block;margin:8px 0;font-size:15px;color:var(--muted)}
#pn input,#pn textarea,#pn select,dialog textarea{display:block;width:100%;box-sizing:border-box;margin-top:2px;padding:4px 8px;background:var(--paper);border:2px solid var(--ink);border-radius:8px 12px 9px 13px/12px 8px 13px 9px}
#pn textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}.row label{flex:1}
h4{font:700 24px "Caveat",cursive;margin:12px 0 4px}
.chip{display:inline-block;margin:0 6px 6px 0;padding:1px 4px 1px 10px;background:var(--sage);border:2px solid var(--ink);border-radius:14px;cursor:pointer}
.chip b{padding:0 6px;color:var(--pop)}
.ph{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;border-bottom:2px dashed var(--ink)}.ph h4{margin:0}.pb{padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.gp{display:flex;flex-wrap:wrap;margin-bottom:4px}.gp .chip{padding:1px 10px}.chip.on{background:var(--butter);color:#2b2a33}
.n.pic{padding-right:50px}.n img{position:absolute;right:6px;top:6px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);object-fit:cover}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
dialog{width:min(560px,92vw);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:14px 20px 16px 22px/20px 14px 22px 16px;box-shadow:5px 5px 0 var(--ink)}
dialog textarea{height:240px;font:14px/1.3 ui-monospace,monospace}
</style>
</head>
<body>
<header>
<h1>Family <u>Tree</u></h1>
<button class="pop" data-a="add">＋ Person</button>
<button data-a="expall">Export all</button>
<button data-a="imp">Import</button>
<div style="position:relative"><input id="q" placeholder="Search…" autocomplete="off"><div id="sr"></div></div>
<select id="pat" title="Paper"><option value="dots">dots</option><option value="grid">grid</option><option value="lines">lines</option><option value="none">plain</option></select><input type="color" id="bgc" title="Paper colour"><input type="color" id="pc" title="Dot/line colour"><button data-a="undo" title="Undo">↶</button><button data-a="redo" title="Redo">↷</button><button data-a="bgr" title="Reset paper colour">↺</button>
</header>
<div id="stage"><div id="cv"></div><div class="zm"><button data-a="zi">＋</button><button data-a="zo">－</button><button data-a="fit">Fit</button><button id="uf" data-a="unfocus" hidden>Show all</button></div></div>
<aside id="pn" hidden></aside>
<dialog id="io"><h4 id="iot"></h4><textarea id="ta" spellcheck="false"></textarea>
<div class="bar"><button data-a="copy">Copy</button><button data-a="ged">JSON → GEDCOM 7</button><button class="pop" data-a="merge">Import this</button><input type="file" id="fi" accept=".json,application/json"><button data-a="ioclose">Close</button></div>
<p id="msg"></p></dialog>
<script>
const K="famtree.v1",CW=200,RH=140,CH=82;
let S={people:{}},sel=null,V={x:20,y:20,k:1},FS=null,H=[],R=[],last="",lt=0;const PT=["biological","adopted","step","foster"],GN=["female","male","nonbinary","genderqueer","genderfluid","agender","trans woman","trans man","intersex","two-spirit","other","unknown"];const MS=["married","partner","engaged","separated","divorced","widowed"];
try{S=JSON.parse(localStorage.getItem(K))||S}catch(e){}
const P=()=>S.people,$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const nm=i=>{const x=P()[i];return x?[x.first,x.middle,x.last].filter(Boolean).join(" ")||"Unnamed":"?"};
const yr=x=>(String(x.born||"").match(/\d{4}/)||[""])[0];
const lab=i=>{const x=P()[i];return nm(i)+(yr(x)?` (b. ${yr(x)})`:"")+(x.parents.length?` · child of ${x.parents.map(q=>nm(q)).join(" & ")}`:"")};
const blank=id=>({id,first:"",middle:"",last:"",other:"",gender:"",color:"",born:"",died:"",dates:"",bio:"",parents:[],spouses:[],ms:{},pt:{},photo:"",bplace:"",dplace:"",src:"",dec:false,btime:"",dtime:""});
const kids=id=>Object.keys(P()).filter(i=>P()[i].parents.includes(id));
const sibs=id=>Object.keys(P()).filter(i=>i!==id&&P()[i].parents.some(q=>P()[id].parents.includes(q)));

function clean(){ // keep relations valid and spouses symmetric
  const p=P(),ok=i=>p[i];
  for(const i in p){const x=p[i];if(x.name!==undefined){const w=String(x.name).trim().split(/\s+/).filter(Boolean);if(!x.first&&!x.last){x.first=w[0]||"";x.last=w.length>1?w[w.length-1]:"";x.middle=w.slice(1,-1).join(" ")}delete x.name}x.first??="";x.middle??="";x.last??="";x.color??="";x.ms={...x.ms};x.pt={...x.pt};x.parents=[...new Set(x.parents||[])].filter(a=>ok(a)&&a!==i);x.spouses=[...new Set(x.spouses||[])].filter(a=>ok(a)&&a!==i)}
  for(const i in p)p[i].spouses.forEach(s=>{if(!p[s].spouses.includes(i))p[s].spouses.push(i);p[i].ms[s]=p[s].ms[i]=p[i].ms[s]||p[s].ms[i]||"married"});
}
function link(k,a,b){const p=P();
  if(k==="parents")p[a].parents.push(b);
  else if(k==="children")p[b].parents.push(a);
  else if(k==="siblings"){const pa=p[a].parents,pb=p[b].parents;
    if(pa.length)p[b].parents=[...new Set([...pb,...pa])];else if(pb.length)p[a].parents=[...pb];
    else{const id=uid();p[id]={...blank(id),first:"(unknown parent)"};p[a].parents=[id];p[b].parents=[id]}}
  else{p[a].spouses.push(b);p[b].spouses.push(a)}clean()}
function unlink(k,a,b){const p=P(),d=(arr,v)=>arr.splice(0,arr.length,...arr.filter(x=>x!==v));
  if(k==="parents")d(p[a].parents,b);else if(k==="children")d(p[b].parents,a);else if(k==="siblings")p[b].parents=p[b].parents.filter(q=>!p[a].parents.includes(q));else{d(p[a].spouses,b);d(p[b].spouses,a)}}

function edges(p,pos){
  const ids=Object.keys(p),fam={},o=[],adj=(a,b)=>pos[a].y===pos[b].y&&Math.abs(pos[a].x-pos[b].x)===CW,
    mk={married:"♥",partner:"♡",engaged:"◇",separated:"sep.",divorced:"div.",widowed:"wid."};
  // couples: a short line between adjacent cards (status symbol above it); otherwise a bracket underneath
  ids.forEach(i=>p[i].spouses.forEach(s=>{if(s<=i)return;const a=pos[i],b=pos[s],t=p[i].ms[s]||"married";
    if(adj(i,s)){const l=Math.min(a.x,b.x)+156,y=a.y+41;o.push(`<path class="sp ${t}" d="M${l} ${y}h${CW-156}"/><text class="st" x="${l+(CW-156)/2}" y="${y-6}" text-anchor="middle">${mk[t]||t}</text>`)}
    else o.push(`<path class="sp ${t}" d="M${a.x+78} ${a.y+CH}v12H${b.x+78}V${b.y+CH}"/>`)}));
  // children: one family = one trunk + one bus + one drop per child
  ids.forEach(i=>{const ps=[...p[i].parents].sort();if(ps.length)(fam[ps.join("|")]??={ps,ch:[]}).ch.push(i)});
  const rn={};
  Object.values(fam).sort((a,b)=>pos[a.ch[0]].x-pos[b.ch[0]].x).forEach(f=>{
    const cy=pos[f.ch[0]].y,n=rn[cy]=(rn[cy]||0)+1,by=cy-38+(n%3)*9,src=[];let ps=f.ps;
    if(ps.length>1&&p[ps[0]].spouses.includes(ps[1])&&adj(ps[0],ps[1])){const a=pos[ps[0]],b=pos[ps[1]];src.push([Math.min(a.x,b.x)+156+(CW-156)/2,a.y+41]);ps=ps.slice(2)}
    ps.forEach(q=>src.push([pos[q].x+78,pos[q].y+CH]));
    const xs=[...src.map(s=>s[0]),...f.ch.map(c=>pos[c].x+78)];
    o.push(`<path d="${src.map(s=>`M${s[0]} ${s[1]}V${by}`).join("")}M${Math.min(...xs)} ${by}H${Math.max(...xs)}"/>`);
    f.ch.forEach(c=>o.push(`<path class="pt-${p[c].pt[f.ps[0]]||"biological"}" d="M${pos[c].x+78} ${by}V${pos[c].y}"/>`))});
  return o.join("")}
function layout(){
  const p=VP(),ids=Object.keys(p),g={};ids.forEach(i=>g[i]=0);
  for(let n=0;n<ids.length+2;n++){let ch=false;
    ids.forEach(i=>{let v=g[i];p[i].parents.forEach(q=>v=Math.max(v,g[q]+1));p[i].spouses.forEach(q=>v=Math.max(v,g[q]));if(v!==g[i]){g[i]=v;ch=true}});
    if(!ch)break}
  const rows=[];ids.forEach(i=>(rows[g[i]]??=[]).push(i));
  const max=Math.max(0,...rows.filter(Boolean).map(r=>r.length)),pos={};
  rows.forEach((r,gi)=>{
    const off=(max-r.length)*CW/2+24;
    const key=i=>{const ps=p[i].parents.filter(q=>pos[q]);return ps.length?ps.reduce((a,q)=>a+pos[q].x,0)/ps.length:1e9};
    r.sort((a,b)=>key(a)-key(b)||nm(a).localeCompare(nm(b)));
    const out=[],seen=new Set();
    r.forEach(i=>{if(seen.has(i))return;seen.add(i);out.push(i);p[i].spouses.forEach(s=>{if(g[s]===gi&&!seen.has(s)){seen.add(s);out.push(s)}})});
    out.forEach((i,k)=>pos[i]={x:off+k*CW,y:gi*RH+30});
  });
  return {pos,w:max*CW+48,h:rows.length*RH+40};
}

function render(){
  bg();snap();$("#uf").hidden=!FS;
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}
  const p=VP(),ids=Object.keys(p),cv=$("#cv");
  if(!ids.length){cv.style.height="300px";cv.innerHTML='<div class="hint">A blank page ✎<br>add your first person</div>';return}
  const {pos,w,h}=layout();const ln=edges(p,pos);
  
  const sh=s=>(String(s).match(/\d{4}/)||[s])[0];const life=x=>{const a=age(x);return (x.born&&x.died?`${sh(x.born)}–${sh(x.died)}`:x.born?"b. "+sh(x.born):x.died?"d. "+sh(x.died):x.dec?"deceased":"")+(a!==""?` · ${a}`:"")};
  cv.style.width=w+"px";cv.style.height=h+"px";
  cv.innerHTML=`<svg width="${w}" height="${h}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><style>.sp{stroke:var(--pop)}.sp.partner,.sp.engaged{stroke-dasharray:5 5}.sp.separated,.sp.divorced{stroke:var(--muted);stroke-dasharray:2 5}.sp.widowed{stroke:var(--muted)}.st{fill:currentColor;stroke:none;font:14px 'Patrick Hand',cursive}.pt-adopted{stroke-dasharray:6 4}.pt-step,.pt-foster{stroke-dasharray:2 5}</style>${ln}</svg>`+
    ids.map(i=>{const x=p[i],c=pos[i],r=([...i].reduce((a,ch)=>a+ch.charCodeAt(0),0)%5-2)*.6;
      return `<div class="n${i===sel?" sel":""}${x.photo?" pic":""}" data-id="${i}" style="left:${c.x}px;top:${c.y}px;--r:${r};${x.color?`background:${esc(x.color)};color:#2b2a33`:""}">${x.photo?`<img src="${esc(x.photo)}" alt="">`:""}<b>${esc(nm(i))}</b><i>${esc(x.other)}&nbsp;</i><small>${esc(life(x))}</small></div>`}).join("");
}

function panel(){
  const x=P()[sel],pn=$("#pn");
  if(!x){pn.hidden=true;return}
  pn.hidden=false;
  const f=(k,l)=>`<label>${l}<input data-f="${k}" value="${esc(x[k])}"></label>`;
  const rel=(k,l,list)=>`<h4>${l}</h4>${list.map(i=>`<span class="chip" data-go="${i}">${esc(nm(i))}<b data-un="${k}:${i}">×</b></span>${k==="parents"?`<select class="ms" data-pt="${i}">${PT.map(s=>`<option${(x.pt[i]||"biological")===s?" selected":""}>${s}</option>`).join("")}</select>`:""}${k==="spouses"?`<select class="ms" data-ms="${i}">${MS.map(s=>`<option${x.ms[i]===s?" selected":""}>${s}</option>`).join("")}</select>`:""}`).join("")}
    <div class="row"><select data-link="${k}"><option value="">link existing…</option>${Object.keys(P()).filter(i=>i!==sel&&!list.includes(i)).map(i=>`<option value="${i}">${esc(lab(i))}</option>`).join("")}</select><button data-new="${k}">＋ new</button></div>`;
  pn.innerHTML=`<div class="ph"><h4>Details</h4><button data-a="close">✕</button></div><div class="pb">
  <div class="row">${f("first","First")}${f("middle","Middle")}${f("last","Last")}</div>${f("other","Other names / nicknames")}
  <label>Gender<input data-f="gender" list="gl" value="${esc(x.gender)}" placeholder="choose or type your own"><datalist id="gl">${GN.map(g=>`<option>${g}</option>`).join("")}</datalist></label>
  <div class="row">${f("born","Born")}${f("died","Died")}</div>
  <label><input type="checkbox" data-c="dec"${x.dec?" checked":""} style="display:inline;width:auto"> Deceased (date unknown)</label>
  <div class="row">${f("bplace","Birth place")}${f("dplace","Death place")}</div>
  <div class="row"><label>Birth time (optional)<input type="time" data-f="btime" value="${esc(x.btime)}"></label><label>Death time (optional)<input type="time" data-f="dtime" value="${esc(x.dtime)}"></label></div>
  <h4>Card colour</h4><div class="sw">${["","#f9cfd2","#fbe0c4","#fbe9a8","#d6e8d0","#c9ece3","#cfe3f3","#ddd3f0"].map(c=>`<span class="s${x.color===c?" on":""}" data-col="${c}" style="background:${c||"var(--card)"}"></span>`).join("")}<input type="color" data-f="color" value="${x.color||"#fffdf6"}"></div>
  <label>Significant dates (one per line, e.g. Married: 1974-06-02)<textarea data-f="dates">${esc(x.dates)}</textarea></label>
  <label>Biography<textarea data-f="bio" style="min-height:110px">${esc(x.bio)}</textarea></label>
  <label>Sources / evidence<textarea data-f="src">${esc(x.src)}</textarea></label>
  <label>Photo<input type="file" accept="image/*" data-photo></label>${x.photo?`<button data-a="rmphoto">Remove photo</button>`:""}
  ${rel("parents","Parents",x.parents)}${rel("siblings","Siblings",sibs(sel))}${rel("spouses","Spouse(s)",x.spouses)}${rel("children","Children",kids(sel))}
  <h4>Focus view</h4><div class="row"><select id="fm"><option value="up">ancestors</option><option value="down">descendants</option><option value="hg">ancestors + descendants</option><option value="all">connected family</option></select><button data-a="focus">Focus</button></div>
  <h4>How are we related?</h4><select id="rw"><option value="">pick someone…</option>${Object.keys(P()).filter(i=>i!==sel).map(i=>`<option value="${i}">${esc(lab(i))}</option>`).join("")}</select><p id="rr"></p>
  <h4>Export branch</h4><div class="row"><select id="scope"><option value="down">this person + descendants</option><option value="up">this person + ancestors</option><option value="all">whole connected family</option></select><button data-a="expbr">Export</button></div>
  <div class="bar"><button data-a="del">Delete person</button></div></div>`;
}

function pick(i){sel=i;render();panel()}
function add(rel){
  const id=uid();P()[id]=blank(id);
  if(rel)link(rel.k,rel.of,id);
  pick(id);center(id);$("#pn [data-f=first]")?.focus();
}
function branch(id,mode){
  const p=P(),set=new Set([id]),q=[id];
  while(q.length){const c=q.shift();
    const nx=mode==="up"?p[c].parents:mode==="down"?kids(c):[...p[c].parents,...kids(c),...p[c].spouses];
    nx.forEach(n=>{if(!set.has(n)){set.add(n);q.push(n)}})}
  [...set].forEach(i=>p[i].spouses.forEach(s=>set.add(s)));
  return set;
}
function dump(set){
  const p=P(),ids=set||new Set(Object.keys(p));
  return JSON.stringify({app:"famtree",v:1,people:[...ids].map(i=>({...p[i],parents:p[i].parents.filter(x=>ids.has(x)),spouses:p[i].spouses.filter(x=>ids.has(x))}))},null,1);
}
function openIO(title,text){$("#iot").textContent=title;$("#ta").value=text;$("#msg").textContent="";$("#io").showModal()}
function merge(){
  try{
    const tx=$("#ta").value.trim(),d=/^0 HEAD/.test(tx)?{people:fromGed(tx)}:JSON.parse(tx),list=Array.isArray(d)?d:d.people;let n=0;
    list.forEach(x=>{if(x&&typeof x.id==="string"){P()[x.id]={...blank(x.id),...x};n++}});
    clean();render();panel();$("#msg").textContent=`Imported ${n} people (matching ids are updated, others added).`;
  }catch(e){$("#msg").textContent="That doesn’t look like a family tree export."}
}

document.addEventListener("click",e=>{
  const t=e.target,un=t.closest("[data-un]");
  if(un){const [k,i]=un.dataset.un.split(":");unlink(k,sel,i);render();panel();return}
  const ht=t.closest("[data-hit]");if(ht){FS=null;sr.innerHTML="";q.value="";pick(ht.dataset.hit);return center(ht.dataset.hit)}
  const sw=t.closest("[data-col]");if(sw){P()[sel].color=sw.dataset.col;render();panel();return}
  const go=t.closest("[data-go]");if(go)return pick(go.dataset.go);
  const nw=t.closest("[data-new]");if(nw)return add({k:nw.dataset.new,of:sel});
  const n=t.closest(".n");if(n)return pick(n.dataset.id);
  const a=t.closest("[data-a]")?.dataset.a;
  if(a==="add")add();
  else if(a==="zi")zoom(1.25,...mid());
  else if(a==="zo")zoom(.8,...mid());
  else if(a==="fit")fit();

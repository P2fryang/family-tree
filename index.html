<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tree</title>
  <link rel="icon" href="favicon.ico" type="image/png">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&display=swap">
  <style>
    :root {
      --paper: #fbf6ea;
      --grid: #eadfc6;
      --ink: #2b2a33;
      --muted: #7a7468;
      --card: #fffdf6;
      --pink: #f9cfd2;
      --blue: #cfe3f3;
      --butter: #fbe9a8;
      --sage: #d6e8d0;
      --pop: #ff8a6b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      color-scheme: light
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --paper: #23212a;
        --grid: #302d3a;
        --ink: #f1ead9;
        --muted: #a59f92;
        --card: #2d2a35;
        --pink: #6a4650;
        --blue: #3f5568;
        --butter: #6b5f34;
        --sage: #46604a;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --paper: #23212a;
      --grid: #302d3a;
      --ink: #f1ead9;
      --muted: #a59f92;
      --card: #2d2a35;
      --pink: #6a4650;
      --blue: #3f5568;
      --butter: #6b5f34;
      --sage: #46604a;
      color-scheme: dark
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      display: flex;
      flex-direction: column;
      font: 18px/1.25 "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
      color: var(--ink);
      background: var(--paper)
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px 16px;
      border-bottom: 2px solid var(--ink);
      background: var(--paper)
    }

    h1 {
      font: 700 34px "Caveat", "Comic Sans MS", cursive;
      margin: 0 auto 0 0;
      transform: rotate(-1.5deg)
    }

    h1 u {
      text-decoration-color: var(--pop);
      text-decoration-thickness: 3px;
      text-underline-offset: 4px
    }

    button,
    select,
    input,
    textarea {
      font: inherit;
      color: var(--ink)
    }

    button {
      cursor: pointer;
      background: var(--butter);
      border: 2px solid var(--ink);
      border-radius: 10px 14px 11px 15px/14px 10px 15px 11px;
      padding: 3px 12px;
      box-shadow: 2px 2px 0 var(--ink)
    }

    button:active {
      transform: translate(2px, 2px);
      box-shadow: none
    }

    button.pop {
      background: var(--pop);
      color: #2b2a33
    }

    #stage {
      flex: 1;
      overflow: hidden;
      position: relative;
      touch-action: none;
      cursor: grab;
      background-color: var(--paper)
    }

    #cv {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0
    }

    .zm {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: flex;
      gap: 6px
    }

    .zm select {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 8px;
      height: 30px;
      padding: 0 4px
    }

    header {
      position: relative
    }

    #set summary {
      list-style: none;
      cursor: pointer;
      background: var(--butter);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 10px 14px 11px 15px/14px 10px 15px 11px;
      padding: 3px 12px;
      box-shadow: 2px 2px 0 var(--ink)
    }

    #set summary::-webkit-details-marker {
      display: none
    }

    .menu {
      position: absolute;
      right: 8px;
      top: 100%;
      z-index: 6;
      max-width: calc(100vw - 16px);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-width: 200px;
      padding: 10px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    .menu label {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center
    }

    #pn .dp {
      display: flex;
      gap: 6px;
      margin: 0 0 4px
    }

    #pn .dp>* {
      width: auto;
      min-width: 0;
      margin-top: 0
    }

    #pn .dp input:first-child {
      flex: 0 0 5.5em
    }

    /* year: fits 4 digits */
    #pn .dp select {
      flex: 1 1 0
    }

    /* month: takes the spare space */
    #pn .dp input:last-child {
      flex: 0 0 3.8em
    }

    /* day: fits 2 digits */
    #pn .dp input[type=number] {
      -moz-appearance: textfield
    }

    #pn .dp input::-webkit-outer-spin-button,
    #pn .dp input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    #pn label.ci {
      display: inline-flex;
      gap: 4px;
      align-items: center;
      margin: 0 0 6px;
      font-size: 15px;
      color: var(--muted)
    }

    #pn label.ci input {
      display: inline-block;
      width: auto;
      margin: 0
    }

    .lk {
      position: absolute;
      right: 5px;
      bottom: 2px;
      font-size: 15px;
      line-height: 1;
      cursor: crosshair;
      opacity: .55
    }

    .lk:hover {
      opacity: 1
    }

    #rb {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4
    }

    #lm {
      position: fixed;
      z-index: 9;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 12px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    #lm[hidden] {
      display: none
    }

    .tb {
      position: absolute;
      cursor: pointer;
      white-space: nowrap
    }

    .tb i {
      display: block;
      box-sizing: border-box;
      height: 12px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--card)
    }

    .tb.sel {
      outline: 3px dashed var(--pop);
      outline-offset: 3px
    }

    .tk {
      position: absolute;
      top: 0;
      height: 100%;
      border-left: 1px dashed color-mix(in srgb, var(--ink) 22%, transparent);
      font-size: 13px;
      color: var(--muted);
      padding: 2px 0 0 3px
    }

    .und {
      position: absolute;
      color: var(--muted)
    }

    .ax {
      position: absolute;
      height: 0;
      border-top: 3px solid var(--ink)
    }

    .at {
      position: absolute;
      height: 10px;
      border-left: 2px solid var(--ink);
      margin-top: -5px
    }

    .ak {
      position: absolute;
      font-size: 13px;
      color: var(--muted)
    }

    .es {
      position: absolute;
      width: 0;
      border-left: 2px solid var(--ink)
    }

    .ed {
      position: absolute;
      z-index: 2;
      width: 12px;
      height: 12px;
      box-sizing: border-box;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--card)
    }

    .ev {
      position: absolute;
      z-index: 1;
      box-sizing: border-box;
      height: 28px;
      line-height: 24px;
      padding: 0 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 10px 14px 11px 15px/14px 10px 15px 11px;
      box-shadow: 2px 2px 0 var(--ink)
    }

    .k-birth {
      background: var(--sage)
    }

    .k-death {
      background: var(--blue)
    }

    .k-marriage {
      background: var(--pink)
    }

    .k-other {
      background: var(--butter)
    }

    .ev.sel {
      outline: 3px dashed var(--pop);
      outline-offset: 2px
    }

    header select,
    header input[type=color] {
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 8px;
      height: 30px;
      padding: 0 4px
    }

    #q {
      width: 140px;
      height: 30px;
      box-sizing: border-box;
      padding: 0 8px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 10px 14px 11px 15px/14px 10px 15px 11px
    }

    #sr {
      position: absolute;
      top: 110%;
      left: 0;
      z-index: 5;
      min-width: 300px;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 10px;
      box-shadow: 3px 3px 0 var(--ink)
    }

    #sr:empty {
      display: none
    }

    #sr div {
      padding: 4px 10px;
      cursor: pointer
    }

    #sr div:hover {
      background: var(--butter);
      color: #2b2a33
    }

    .sw {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap
    }

    .sw .s {
      width: 24px;
      height: 24px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      cursor: pointer
    }

    .sw .s.on {
      outline: 3px dashed var(--pop);
      outline-offset: 2px
    }

    #pn .sw input {
      width: 34px;
      display: inline-block;
      padding: 0;
      margin: 0
    }

    #pn select.ms {
      display: inline-block;
      width: auto;
      margin: 0 6px 6px 0
    }

    #cv svg {
      position: absolute;
      inset: 0;
      pointer-events: none
    }

    .n {
      position: absolute;
      width: 156px;
      height: 82px;
      box-sizing: border-box;
      padding: 8px 10px;
      overflow: hidden;
      cursor: pointer;
      background: var(--card);
      border: 2px solid var(--ink);
      border-radius: 12px 18px 14px 20px/18px 12px 20px 14px;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(calc(var(--r)*1deg))
    }

    .n.sel {
      outline: 3px dashed var(--pop);
      outline-offset: 3px
    }

    .n b {
      display: block;
      font-size: 19px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .n i,
    .n small {
      display: block;
      opacity: .65;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px
    }

    .hint {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max-content;
      max-width: 90%;
      transform: translate(-50%, -50%) rotate(-2deg);
      pointer-events: none;
      font: 700 30px "Caveat", cursive;
      text-align: center;
      color: var(--muted)
    }

    #pn {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(370px, 100%);
      box-sizing: border-box;
      overflow: auto;
      padding: 0;
      background: var(--card);
      border-left: 2px solid var(--ink);
      box-shadow: -4px 0 0 var(--grid)
    }

    #pn[hidden] {
      display: none
    }

    #pn label {
      display: block;
      margin: 8px 0;
      font-size: 15px;
      color: var(--muted)
    }

    #pn input,
    #pn textarea,
    #pn select,
    dialog textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-top: 2px;
      padding: 4px 8px;
      background: var(--paper);
      border: 2px solid var(--ink);
      border-radius: 8px 12px 9px 13px/12px 8px 13px 9px
    }

    #pn textarea {
      min-height: 64px;
      resize: vertical
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row label {
      flex: 1
    }

    h4 {
      font: 700 24px "Caveat", cursive;
      margin: 12px 0 4px
    }

    .chip {
      display: inline-block;
      margin: 0 6px 6px 0;
      padding: 1px 4px 1px 10px;
      background: var(--sage);
      border: 2px solid var(--ink);
      border-radius: 14px;
      cursor: pointer
    }

    .chip b {
      padding: 0 6px;
      color: var(--pop)
    }

    .ph {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 6px;
      border-bottom: 2px dashed var(--ink)
    }

    .ph h4 {
      margin: 0
    }

    .pb {
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px))
    }

    .gp {
      display: flex;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    .gp .chip {
      padding: 1px 10px
    }

    .chip.on {
      background: var(--butter);
      color: #2b2a33
    }

    .cb{position:absolute;right:26px;bottom:3px;font-size:14px;line-height:1;padding:1px 5px;background:var(--butter);color:#2b2a33;border:2px solid var(--ink);border-radius:9px;cursor:pointer}
    .n.hb small{box-sizing:border-box;padding-right:62px}
    .n.est{border-style:dashed}
    .yg{position:absolute;left:0;width:100%;height:0;border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent);pointer-events:none}
    .yg span{position:absolute;left:3px;top:-15px;font-size:13px;color:var(--muted)}
    .n { overflow: visible; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
    .n.src { outline: 3px dashed var(--pop); outline-offset: 3px }
    .n.tgt { outline: 3px solid var(--pop); outline-offset: 3px; transform: rotate(calc(var(--r)*1deg)) scale(1.06) }
    @media (pointer: coarse) { .lk { display: none } #lm button { padding: 8px 16px } }

    .pl {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 14px;
      line-height: 1;
      padding: 2px 8px;
      white-space: nowrap;
      cursor: pointer;
      opacity: .5;
      color: #2b2a33;
      background: var(--butter);
      border: 2px solid var(--ink);
      border-radius: 11px;
      box-shadow: 1px 1px 0 var(--ink)
    }

    .pl.up { top: -13px }
    .pl.dn { bottom: -13px }
    .pl.on { background: var(--pop); opacity: 1 }
    .n:hover .pl, .n.sel .pl, .pl:hover { opacity: 1 }

    .n.pic {
      padding-right: 50px
    }

    .n img {
      position: absolute;
      right: 6px;
      top: 6px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--ink);
      object-fit: cover
    }

    .bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px
    }

    dialog {
      width: min(560px, 92vw);
      background: var(--card);
      color: var(--ink);
      border: 2px solid var(--ink);
      border-radius: 14px 20px 16px 22px/20px 14px 22px 16px;
      box-shadow: 5px 5px 0 var(--ink)
    }

    dialog textarea {
      height: 240px;
      font: 14px/1.3 ui-monospace, monospace
    }
  </style>
</head>

<body>
  <header>
    <h1>Family <u>Tree</u></h1>
    <button class="pop" data-a="add">＋ Person</button>
    <div style="position:relative"><input id="q" placeholder="Search…" autocomplete="off">
      <div id="sr"></div>
    </div>
    <button data-a="undo" title="Undo">↶</button><button data-a="redo" title="Redo">↷</button><select id="vw"
      title="View">
      <option value="">Tree</option>
      <option value="g">Timeline tree</option>
      <option value="t">Life spans</option>
      <option value="e">Events</option>
    </select>
    <details id="set">
      <summary title="Settings">⚙</summary>
      <div class="menu"><button data-a="expall">Export all</button><button data-a="expcol">Expand all</button><button data-a="imp">Import /
          sync</button><label>Paper <select id="pat">
            <option value="dots">dots</option>
            <option value="grid">grid</option>
            <option value="lines">lines</option>
            <option value="none">plain</option>
          </select></label><label>Colours <input type="color" id="bgc" title="Paper colour"><input type="color" id="pc"
            title="Dot/line colour"><button data-a="bgr" title="Reset colours">↺</button></label></div>
    </details>
  </header>
  <div id="stage">
    <div id="cv"></div>
    <div class="hint" id="em" hidden>A blank page ✎<br>add your first person</div><svg id="rb" style="display:none">
      <line stroke="var(--pop)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round" />
    </svg>
    <div class="zm"><button data-a="zi">＋</button><button data-a="zo">－</button><button data-a="fit">Fit</button></div>
  </div>
  <aside id="pn" hidden></aside>
  <div id="lm" hidden></div>
  <dialog id="io">
    <h4 id="iot"></h4><textarea id="ta" spellcheck="false"></textarea>
    <div class="bar"><button data-a="copy">Copy</button><button class="pop" data-a="dl">Download</button><button
        data-a="ged">JSON → GEDCOM 7</button><button class="pop" data-a="merge">Import this</button><input type="file"
        id="fi" accept=".json,.ged,application/json"><button data-a="ioclose">Close</button></div>
    <p id="msg"></p>
  </dialog>
  <script>
    const K = "famtree.v1", CW = 200, RH = 160, CH = 82;
    let S = { people: {} }, sel = null, V = { x: 20, y: 20, k: 1 }, VM = "", DIM = { w: 1, h: 1 }, POS = {}, sg = null, LK = null, H = [], R = [], last = "", lt = 0;
    const PAL = { "#f9cfd2": "#c76b78", "#fbe0c4": "#c9824a", "#fbe9a8": "#b8962e", "#d6e8d0": "#6f9a62", "#c9ece3": "#4f9d8c", "#cfe3f3": "#5b8fbf", "#ddd3f0": "#8a72b8" },
      bdr = c => PAL[c] || "#" + [1, 3, 5].map(i => Math.round(parseInt(c.slice(i, i + 2), 16) * .55).toString(16).padStart(2, "0")).join(""); const PT = ["biological", "adopted", "step", "foster"], GN = ["female", "male", "nonbinary", "genderqueer", "genderfluid", "agender", "trans woman", "trans man", "intersex", "two-spirit", "other", "unknown"]; const MS = ["married", "partner", "engaged", "separated", "divorced", "widowed"];
    try { S = JSON.parse(localStorage.getItem(K)) || S } catch (e) { }
    const P = () => S.people, $ = s => document.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const uid = () => Math.random().toString(36).slice(2, 9);
    const nm = i => { const x = P()[i]; return x ? [x.first, x.middle, x.last].filter(Boolean).join(" ") || "Unnamed" : "?" };
    const yr = x => (String(x.born || "").match(/\d{4}/) || [""])[0];
    const lab = i => { const x = P()[i]; return nm(i) + (yr(x) ? ` (b. ${yr(x)})` : "") + (x.parents.length ? ` · child of ${x.parents.map(q => nm(q)).join(" & ")}` : "") };
    const blank = id => ({ id, first: "", middle: "", last: "", other: "", gender: "", color: "", born: "", died: "", dates: "", bio: "", parents: [], stepParents: [], spouses: [], ms: {}, pt: {}, photo: "", bplace: "", dplace: "", src: "", dec: false, btime: "", dtime: "", u: 0 });
    const kids = id => Object.keys(P()).filter(i => P()[i].parents.includes(id));
    const sibs = id => Object.keys(P()).filter(i => i !== id && P()[i].parents.some(q => P()[id].parents.includes(q)));

    // fold: a married-in partner whose own parents' family is a dead end (no ancestors, nobody else attached) can be tucked away behind a "▸ n" badge
    function folds() {
      const p = P(), m = new Map();
      for (const x in p) {
        if (!p[x].parents.length || !p[x].spouses.some(s => p[s].parents.some(q => p[q].parents.length))) continue;
        const C = new Set(p[x].parents); p[x].parents.forEach(a => { p[a].spouses.forEach(s => C.add(s)); kids(a).forEach(c => c !== x && C.add(c)) });
        if (C.has(x) || p[x].spouses.some(s => C.has(s))) continue;
        if ([...C].every(c => p[c].parents.every(q => C.has(q)) && p[c].spouses.every(q => C.has(q)) && kids(c).every(k => C.has(k) || k === x))) m.set(x, C)
      }
      return m
    }
    function clean() { // keep relations valid and spouses symmetric
      const p = P(), ok = i => p[i];
      for (const i in p) {
        const x = p[i]; if (x.name !== undefined) { const w = String(x.name).trim().split(/\s+/).filter(Boolean); if (!x.first && !x.last) { x.first = w[0] || ""; x.last = w.length > 1 ? w[w.length - 1] : ""; x.middle = w.slice(1, -1).join(" ") } delete x.name } x.first ??= ""; x.middle ??= ""; x.last ??= ""; x.color ??= ""; x.ms = { ...x.ms }; x.pt = { ...x.pt }; x.born = nd(x.born); x.died = nd(x.died); x.parents = [...new Set(x.parents || [])].filter(a => ok(a) && a !== i);
        // migrate older data: a parent recorded as "step" moves to stepParents
        Object.keys(x.pt).forEach(q => { if (x.pt[q] === "step" && x.parents.includes(q)) { x.parents = x.parents.filter(a => a !== q); (x.stepParents ??= []).push(q) } });
        x.stepParents = [...new Set(x.stepParents || [])].filter(a => ok(a) && a !== i && !x.parents.includes(a));
        x.spouses = [...new Set(x.spouses || [])].filter(a => ok(a) && a !== i)
      }
      for (const i in p) p[i].spouses.forEach(s => { if (!p[s].spouses.includes(i)) p[s].spouses.push(i); p[i].ms[s] = p[s].ms[i] = p[i].ms[s] || p[s].ms[i] || "married" });
    }
